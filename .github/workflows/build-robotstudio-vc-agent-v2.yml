name: Build RobotStudio VC Agent v2.0

on:
  push:
    branches:
      - build/robotstudio-vc-agent-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Reconstruct and inspect source
        shell: pwsh
        run: |
          $parts = Get-ChildItem .ci/source.part* | Sort-Object Name
          $base64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join '') -replace '\s',''
          [IO.File]::WriteAllBytes('RobotStudioVCAgent-source.zip', [Convert]::FromBase64String($base64))
          $hash = (Get-FileHash RobotStudioVCAgent-source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Reconstructed source SHA256: $hash"
          Expand-Archive -Path RobotStudioVCAgent-source.zip -DestinationPath RobotStudioVCAgent -Force
          if (!(Test-Path RobotStudioVCAgent/build/Build-Package.ps1)) { throw 'Source archive does not contain build script' }
      - name: Build and package
        shell: pwsh
        run: ./RobotStudioVCAgent/build/Build-Package.ps1
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: ABB-RobotStudio-VC-Full-Agent-v2.0
          path: RobotStudioVCAgent/out/*
          if-no-files-found: error
