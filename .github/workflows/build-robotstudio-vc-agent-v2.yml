name: Build RobotStudio VC Agent v2.0

on:
  push:
    branches:
      - build/robotstudio-vc-agent-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Capture reconstructed Base64
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import glob, re
          source = ''.join(Path(p).read_text(encoding='utf-8') for p in sorted(glob.glob('.ci/source.part*')))
          source = re.sub(r'\s', '', source)
          Path('pre-base64.txt').write_text(source, encoding='ascii')
          Path('capture-report.txt').write_text(f'length={len(source)}\n', encoding='utf-8')
          '@ | Set-Content -Path capture_source.py -Encoding UTF8
          python capture_source.py
      - name: Upload exact reconstructed text
        uses: actions/upload-artifact@v4
        with:
          name: exact-reconstructed-base64
          path: |
            pre-base64.txt
            capture-report.txt
          if-no-files-found: error
      - name: Stop after capture
        shell: pwsh
        run: throw 'Diagnostic capture completed intentionally.'
