name: Build RobotStudio VC Agent v2.0

on:
  push:
    branches:
      - build/robotstudio-vc-agent-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Reconstruct and verify source archive
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64, glob, hashlib, re
          source = ''.join(Path(p).read_text(encoding='utf-8') for p in sorted(glob.glob('.ci/source.part*')))
          source = re.sub(r'\s', '', source)
          edits = [[8242,8243,"p"],[16649,16649,"HVka"],[16650,16655,"8v"],[16657,16659,"QJ"],[16661,16661,"MD2GJqA9hianV4C"],[16662,16679,""],[16681,16686,""],[16687,16694,""],[16700,16701,"E6QMAAFBLAwQKAAAAAACCGf"],[16702,16705,"c"],[22774,22774,"24vQUJCLlZDQ"],[22775,22776,"dlbnQ"],[22777,22797,"cH"],[22798,22798,"x"],[22800,22800,"Q"],[23606,23613,"HVk"],[23615,23616,"8vUml"],[23617,23765,""],[23768,23768,"uL"],[23769,23784,"N"],[23786,23793,"nRy"],[23795,23795,"xIZWxwVGV"],[23796,23796,"dHM"],[23854,23861,""],[23862,23863,"Kan2ju"],[23865,23868,"AAcQE"],[23871,23872,"0"],[23890,23890,"D"],[23891,23892,""],[23932,23932,"SaWJib24vUmliYm9uLnhtbFVU"],[23933,23939,"QADA9hian"],[23940,23953,"4Cw"],[23954,23969,"BB"],[23975,23976,"E6QMAAFBLAQIeAxQAAAAIAIIZ+FwFcIoqhAcAANoZAAA"],[23978,23978,"BgAAAAAAAEAAACkgYE1AABzcmMvQUJCLlZDQWdlbnQuUm9ib3RTdHVkaW8vQWRkSW5FbnRyeS5jc1VUBQADA9hianV4C"],[23980,23984,"B"],[23986,23990,""],[23992,23992,"AAAE6QMAAFBLAQIeAxQ"],[24074,24085,"H"],[24087,24087,"aW8vQUJCLlZDQWdlbnQuUm9ib3RTdHVkaW8uY3"],[24088,24113,"w"],[24114,24120,"m9q"],[24122,24124,"QF"],[24126,24136,"MD2GJqdXgL"],[24138,24140,"EE"],[24145,24149,"ATpAw"],[24151,24151,"UEsF"],[24152,24157,"g"],[24162,24162,"SA"],[24165,24166,"K"],[24167,24171,"c"]]
          for start, end, replacement in reversed(edits):
              source = source[:start] + replacement + source[end:]
          raw = base64.b64decode(source, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = '154080f1e90876a71c0981028b436ad6c9c0f0415385bc1e060409e879f59d45'
          if digest != expected:
              raise SystemExit(f'Source archive hash mismatch: {digest}')
          Path('RobotStudioVCAgent-source.zip').write_bytes(raw)
          print(f'Verified source SHA256: {digest}')
          '@ | Set-Content -Path reconstruct_source.py -Encoding UTF8
          python reconstruct_source.py
      - name: Inspect source archive
        shell: pwsh
        run: |
          Expand-Archive -Path RobotStudioVCAgent-source.zip -DestinationPath RobotStudioVCAgent -Force
          if (!(Test-Path RobotStudioVCAgent/build/Build-Package.ps1)) { throw 'Source archive does not contain build script' }
      - name: Apply verified RWS endpoint corrections
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('RobotStudioVCAgent/package/common/ABB.VCAgent.ps1')
          text = path.read_text(encoding='utf-8-sig')
          replacements = {
              "Invoke-RwsAction \"/rw/iosystem/signals/$p\" 'set-simulated' @{simulated='true'}": "Invoke-RwsAction \"/rw/iosystem/signals/$p\" 'set' @{lstate='simulated'}",
              "Invoke-RwsAction \"/rw/iosystem/signals/$p\" 'set-simulated' @{simulated='false'}": "Invoke-RwsAction \"/rw/iosystem/signals/$p\" 'set' @{lstate='not simulated'}",
              "Invoke-RwsAction \"/rw/iosystem/signals/$p\" 'pulse' @{pulses='1';activepulse='200';passivepulse='200'}": "Invoke-RwsAction \"/rw/iosystem/signals/$p\" 'set' @{mode='pulse';Pulses='1';ActivePulse='200';PassivePulse='200'}",
              "Invoke-RwsAction \"/rw/iosystem/signals/$p\" 'invert' @{}": "Invoke-RwsAction \"/rw/iosystem/signals/$p\" 'set' @{mode='invert'}",
              "Invoke-RwsAction \"/rw/rapid/tasks/$task/program\" 'saveprog' @{progpath=$txtRemoteFile.Text}": "Invoke-RwsAction \"/rw/rapid/tasks/$task/program\" 'save' @{path=$txtRemoteFile.Text}",
              "$txtBackup=Add-Text $t '$HOME/Backups/AgentBackup' 175 22 500": "$txtBackup=Add-Text $t '/fileservice/$syspar/tempfolder/AgentBackup' 175 22 500",
              "Invoke-RwsAction '/ctrl/backup' 'backup' @{'backup-path'=$txtBackup.Text;'include-mp'='false'}": "Invoke-RwsAction '/ctrl/backup' 'backup' @{backup=$txtBackup.Text;archive='false'}",
              "Invoke-RwsAction '/ctrl/restart' 'restart' @{'restart-mode'=$cmbRestart.SelectedItem}": "Invoke-Rws -Method POST -Path '/ctrl' -Form @{'restart-mode'=$cmbRestart.SelectedItem}",
              "Add-Button $t '设置运行周期' 545 115 { Invoke-RwsAction '/rw/rapid/execution' 'setcycle' @{cycle=$cmbCycle.SelectedItem} } 160": "Add-Button $t '设置运行周期' 545 115 { if($cmbCycle.SelectedItem -eq 'asis'){throw 'setcycle 仅支持 once 或 forever'}; Invoke-RwsAction '/rw/rapid/execution' 'setcycle' @{cycle=$cmbCycle.SelectedItem} } 160"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8-sig')
          print(f'Applied {len(replacements)} RWS corrections to {path}')
          '@ | Set-Content -Path patch_rws.py -Encoding UTF8
          python patch_rws.py
      - name: Build and package
        shell: pwsh
        run: ./RobotStudioVCAgent/build/Build-Package.ps1
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: ABB-RobotStudio-VC-Full-Agent-v2.0
          path: RobotStudioVCAgent/out/*
          if-no-files-found: error
